version: '3.8'

services:
  # ==============================================================================
  # PostgreSQL Database Service
  # ==============================================================================
  postgres-db:
    image: postgres:15-alpine
    container_name: redops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-redops_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redops_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-redops_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redops_admin} -d ${POSTGRES_DB:-redops_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # RedOps REST API Backend Service
  # ==============================================================================
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: redops-backend
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-redops_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-redops_secure_pass_2026}
      DB_NAME: ${POSTGRES_DB:-redops_db}
      JWT_SECRET: ${JWT_SECRET:-redops_super_secret_jwt_key_university_2026}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      CORS_ORIGIN: "*"
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads

volumes:
  postgres_data:
    driver: local
